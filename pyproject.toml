[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "svenskalag-cli"
version = "0.1.0"
description = "An unofficial, agent-friendly CLI for Svenskalag.se."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "platformdirs>=4.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.scripts]
svenskalag = "svenskalag_cli.cli:main"

[project.optional-dependencies]
completion = ["argcomplete>=3.0"]

[dependency-groups]
dev = ["pytest>=9.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
